<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#141b35"/>
      <stop offset="100%" stop-color="#1a1140"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="260" cy="180" r="180" fill="#7dd3fc" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1320" cy="700" r="220" fill="#a78bfa" opacity="0.12" filter="url(#glow)"/>

  <text x="100" y="170" font-family="Arial, Segoe UI, sans-serif" font-size="28" fill="#7dd3fc" letter-spacing="4">ЦИФРОВОЙ ПРОДУКТ</text>
  <text x="100" y="270" font-family="Arial, Segoe UI, sans-serif" font-size="72" font-weight="700" fill="#eef2ff">Стартовый набор</text>
  <text x="100" y="350" font-family="Arial, Segoe UI, sans-serif" font-size="72" font-weight="700" fill="url(#accent)">фрилансера</text>
  <text x="100" y="420" font-family="Arial, Segoe UI, sans-serif" font-size="32" fill="#b8c1d9">5 готовых шаблонов для работы с клиентами</text>

